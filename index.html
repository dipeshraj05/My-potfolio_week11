<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <style>
        /* Default Light Mode Styles */
        body {
            background-color: #ffffff;
            color: #333333;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
        }

        /* Dark Mode Styles triggered by the 'dark-mode' class */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }

        #gallery-section {
            margin-top: 25px;
        }

        #gallery-image {
            display: block;
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <!-- Your existing portfolio content -->
    <h1>Welcome to My Portfolio</h1>
    <p>Exploring frontend web development step by step.</p>

    <!-- Week 11: Dark Mode Toggle Button -->
    <button id="theme-toggle">🌙 Toggle Dark Mode</button>

    <!-- Week 12 Step 1: Hobby/Skill List Container -->
    <h2>My Hobbies & Skills</h2>
    <div id="hobby-list"></div>

    <!-- Week 12 Step 2: Hobby Gallery (Extension) -->
    <div id="gallery-section">
        <h2>Hobby Gallery</h2>
        <img id="gallery-image" src="https://picsum.photos/id/1018/300/200" alt="Hobby Gallery Photo">
        <button id="next-photo-btn">Next Photo</button>
    </div>

    <!-- Link your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
