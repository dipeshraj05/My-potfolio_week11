<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <style>
        /* Default Light Mode Styles */
        body {
            background-color: #ffffff;
            color: #333333;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
        }

        /* Dark Mode Styles triggered by the 'dark-mode' class */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <!-- Your existing portfolio content -->
    <h1>Welcome to My Portfolio</h1>
    <p>Exploring frontend web development step by step.</p>

    <!-- Week 11: Dark Mode Toggle Button -->
    <button id="theme-toggle">🌙 Toggle Dark Mode</button>

    <!-- Link your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
